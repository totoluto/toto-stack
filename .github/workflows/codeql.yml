name: CodeQL

# Code scanning must be enabled in the repository settings before results can
# be uploaded. Until a maintainer has done that and set the repository
# variable CODE_SCANNING_ENABLED=true, the analysis still runs on every PR, but
# its results are kept as a SARIF artifact and summarised on the run instead
# of being uploaded (an upload would fail every run).

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}
          output: ${{ runner.temp }}/codeql-results

      - name: Keep SARIF results
        if: vars.CODE_SCANNING_ENABLED != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/codeql-results
          retention-days: 14

      - name: Summarise results
        if: vars.CODE_SCANNING_ENABLED != 'true'
        run: node .github/scripts/sarif-summary.mjs "$RUNNER_TEMP/codeql-results"
