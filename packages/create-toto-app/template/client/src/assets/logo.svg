<svg width="100%" height="100%" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3F51B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8186FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stack of boxes -->
  <g>
    <!-- Bottom box -->
    <rect x="12" y="40" width="40" height="16" fill="url(#grad)" opacity="0.4"/>
    <!-- Middle box -->
    <rect x="12" y="28" width="40" height="16" fill="url(#grad)" opacity="0.7"/>
    <!-- Top box -->
    <rect x="12" y="16" width="40" height="16" fill="url(#grad)"/>
  </g>
